<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="&#x30D3;&#x30C3;&#x30C8;&#x30B9;&#x30C6;&#x30C3;&#x30D7;">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><title>ビットステップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column; home = circuit-trace lesson path, lesson = full-screen quiz with a fixed answer bar */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E8EDF4; --ink:#18202E; --muted:#5B6880; --line:#D8E0EA; --trace:#BAC6D6;
  --accent:#E05A0A; --accent-deep:#B34500; --on-accent:#FFFFFF;
  --ok:#0F8F6F; --ok-bg:#DCF4EC; --bad:#D63A3F; --bad-bg:#FCE6E7; --led:#FFB020; --led-glow:rgba(255,176,32,.55);
  --u1:#E35A0B; --u2:#0B8A8A; --u3:#6050DC; --u4:#D63A5E; --u5:#2573C4; --u6:#A87700; --u7:#198A4E; --u8:#B5357F;
  --f-display:"Dela Gothic One","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1420; --surface:#18202F; --sunk:#111827; --ink:#E7ECF4; --muted:#97A3B8; --line:#2A3549; --trace:#34425B;
  --accent:#F06A1A; --accent-deep:#B34500; --ok:#34C79F; --ok-bg:#0E3A2F; --bad:#FF6B70; --bad-bg:#43181B; --led:#FFB830; --led-glow:rgba(255,184,48,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#18202F; --sunk:#111827; --ink:#E7ECF4; --muted:#97A3B8; --line:#2A3549; --trace:#34425B;
  --accent:#F06A1A; --accent-deep:#B34500; --ok:#34C79F; --ok-bg:#0E3A2F; --bad:#FF6B70; --bad-bg:#43181B; --led:#FFB830; --led-glow:rgba(255,184,48,.45);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{overscroll-behavior-y:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--u5);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code,.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:16px;letter-spacing:.04em;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s, box-shadow .06s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.okb{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.badb{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.iconbtn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.iconbtn:hover{background:var(--sunk)}

/* ---------- home ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.stats{display:flex;gap:4px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;padding:6px 8px;border-radius:10px;background:none;border:0;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--sunk)}
.stat svg{width:22px;height:22px}
.stat.off{color:var(--muted)}

.goal{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.goal h3{font-size:15px}
.goal p{margin:0;color:var(--muted);font-size:13px}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--led);border-radius:99px;transition:width .5s}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tool{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;position:relative}
.tool svg{width:28px;height:28px}
.tool:active{transform:translateY(2px);border-bottom-width:2px}
.tool .badge{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 6px;font-variant-numeric:tabular-nums}

.unit{margin-top:28px}
.band{background:var(--uc);color:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 65%,#000);position:relative;overflow:hidden}
.band::after{content:attr(data-bits);position:absolute;right:12px;bottom:-6px;font-family:var(--f-mono);font-weight:700;font-size:40px;opacity:.16;letter-spacing:.05em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;margin:0;opacity:.9}
.band h2{font-family:var(--f-display);font-size:22px;font-weight:400;margin:2px 0}
.band p{margin:0;font-size:14px;opacity:.95}
.path{position:relative;margin-top:8px}
.path svg.trace{position:absolute;left:50%;top:0;margin-left:-150px;overflow:visible;pointer-events:none}
.node{position:absolute;width:72px;height:68px;border:0;border-radius:20px;background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000);display:grid;place-items:center;transition:transform .06s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.node svg{width:32px;height:32px}
.node.locked{background:var(--sunk);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.node.current{outline:4px solid color-mix(in srgb,var(--uc) 35%,transparent);outline-offset:5px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:9px;outline-color:color-mix(in srgb,var(--uc) 10%,transparent)}}
.node .pins{position:absolute;inset:auto 10px -11px;display:flex;justify-content:space-between;pointer-events:none}
.nlabel{position:absolute;top:12px;width:128px;font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);pointer-events:none}
.nlabel small{display:block;white-space:nowrap;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.nlabel.r{left:88px}.nlabel.l{right:88px;text-align:right}
.node.locked + .nlabel{color:var(--muted)}
.bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--uc);border:2px solid var(--line);font-weight:800;font-size:13px;padding:2px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.foot-note{color:var(--muted);font-size:12px;text-align:center;padding-block:28px 48px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .2s ease-out;max-height:85vh;overflow:auto}
@keyframes up{from{transform:translateY(40px)}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px}
.sheet .meta{color:var(--muted);font-size:14px;margin:4px 0 16px}
.row{display:flex;gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0 18px}
.bdg{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
.bdg b{display:block;font-size:13px;color:var(--ink)}
.bdg .chip{width:40px;height:40px;margin:0 auto 6px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.bdg.got{border-color:var(--led)}
.bdg.got .chip{background:var(--led);color:#3a2500;box-shadow:0 0 14px var(--led-glow)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--sunk);border-radius:12px;padding:10px;text-align:center}
.kv b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}

/* ---------- lesson ---------- */
.lesson{min-height:100%;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:12px;padding-block:14px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.qarea{flex:1;padding-bottom:180px}
.qkind{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:8px 0 4px;display:flex;justify-content:space-between;align-items:center}
.qtext{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 16px;text-wrap:balance}
.bm{font-family:var(--f-body);font-size:12px;letter-spacing:0;border:2px solid var(--line);border-radius:99px;padding:2px 10px;background:none;color:var(--muted);font-weight:700}
.bm.on{background:var(--led);border-color:var(--led);color:#3a2500}
pre.code{background:var(--sunk);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px;overflow-x:auto;font-family:var(--f-mono);font-size:15px;line-height:1.6;white-space:pre}
.tk-k{color:var(--u3)}.tk-s{color:var(--u7)}.tk-n{color:var(--u1)}.tk-b{color:var(--u5)}.tk-c{color:var(--muted)}
:root[data-theme="dark"] .tk-k,:root[data-theme="dark"] .tk-b{filter:brightness(1.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tk-k,:root:not([data-theme="light"]) .tk-b{filter:brightness(1.5)}}
.big{font-family:var(--f-mono);font-weight:700;font-size:44px;letter-spacing:.12em;text-align:center;background:var(--sunk);border-radius:var(--r);padding:14px;margin:0 0 18px;font-variant-numeric:tabular-nums}
.big sub{font-size:16px;color:var(--muted);letter-spacing:0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:17px}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.opt .t{white-space:pre-line;min-width:0}
.opt.mono .t{font-family:var(--f-mono)}
.opt.sel{border-color:var(--u5);background:color-mix(in srgb,var(--u5) 12%,var(--surface));color:var(--u5)}
.opt.sel .k{border-color:var(--u5);color:var(--u5)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{justify-content:center;font-size:28px;font-family:var(--f-mono);padding:18px}
.opts.two .opt .k{display:none}
.field{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:24px;font-weight:700;padding:14px 16px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.06em}
.field:focus{border-color:var(--u5);outline:none}

.bits{display:grid;grid-template-columns:repeat(var(--n),minmax(0,64px));justify-content:center;gap:8px;margin:6px 0 14px}
.bit{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.bit .w{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:700}
.bit .lamp{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--sunk);border:2px solid var(--line);border-bottom-width:5px;display:grid;place-items:center;transition:background .12s, box-shadow .12s}
.bit .lamp svg{width:58%;height:58%;color:var(--trace)}
.bit.on .lamp{background:var(--led);border-color:color-mix(in srgb,var(--led) 70%,#000);box-shadow:0 0 18px var(--led-glow)}
.bit.on .lamp svg{color:#5a3a00}
.bit .v{font-family:var(--f-mono);font-size:20px;font-weight:700}
.bitsum{text-align:center;font-family:var(--f-mono);color:var(--muted);font-size:15px;min-height:24px}
.bitsum b{color:var(--ink);font-size:20px}

.slot{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{font-family:var(--f-mono);font-weight:700;font-size:17px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:7px 13px}
.tok.used{visibility:hidden}

.tip{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.tip .say{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;min-width:0}
.tip .say::before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.tip h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:6px}
.tip p{margin:0 0 10px}.tip p:last-child{margin:0}
.tip pre.code{margin:8px 0 10px;font-size:14px}
.tip table{border-collapse:collapse;font-family:var(--f-mono);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.tip td,.tip th{border:2px solid var(--line);padding:3px 12px;text-align:center}
.tip th{background:var(--sunk);font-weight:700}
.diag{display:inline-grid;grid-auto-flow:column;gap:6px;margin:6px 0 10px;font-family:var(--f-mono);text-align:center}
.diag span{display:grid;gap:2px}
.diag i{font-style:normal;font-size:11px;color:var(--muted)}
.diag b{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);border:2px solid var(--line)}
.diag b.on{background:var(--led);border-color:var(--led);color:#3a2500}
.hl{background:color-mix(in srgb,var(--led) 35%,transparent);border-radius:4px;padding:0 3px;font-weight:800}

/* answer bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.foot.ok{background:var(--ok-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fb .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.fb .ic svg{width:26px;height:26px}
.foot.ok .fb{color:var(--ok)}.foot.bad .fb{color:var(--bad)}
.fb h4{margin:0;font-size:20px;font-weight:800}
.fb p{margin:2px 0 0;color:var(--ink);font-size:14px}
.fb .ans{font-family:var(--f-mono);font-weight:700;white-space:pre-line}
.foot .row .btn{flex:1}
.foot .try{flex:0 0 auto;width:auto}

/* result */
.center{text-align:center;padding-block:40px 120px;display:flex;flex-direction:column;align-items:center;gap:14px}
.center h1{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent)}
.center p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin-top:8px}
.tile{border:2px solid var(--tc);border-radius:var(--r);overflow:hidden}
.tile span{display:block;background:var(--tc);color:#fff;font-size:12px;font-weight:800;padding:3px;letter-spacing:.06em}
.tile b{display:block;font-size:24px;padding:10px 4px;font-variant-numeric:tabular-nums}

/* playground */
.pg textarea{width:100%;box-sizing:border-box;min-height:220px;font-family:var(--f-mono);font-size:15px;line-height:1.6;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);resize:vertical;tab-size:2}
.pg .out{font-family:var(--f-mono);font-size:15px;background:#0E1320;color:#D7F7E6;border-radius:12px;padding:14px;min-height:80px;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.pg .out .err{color:#FF9A9E}
.pg .out .dim{color:#7C8AA5}
.samples{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.samples button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.pg h1{font-family:var(--f-display);font-weight:400;font-size:24px}
.pg p.lead{color:var(--muted);margin:4px 0 12px}

/* time attack */
.ta-timer{font-family:var(--f-mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent)}
.flash-ok{animation:fok .35s}.flash-bad{animation:fbad .35s}
@keyframes fok{30%{background:var(--ok-bg);border-color:var(--ok)}}
@keyframes fbad{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:50;animation:up .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}

.mascot{display:block}
.mascot.bounce{animation:bob2 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tool{font-size:12px;white-space:nowrap;padding-inline:4px}.band::after{font-size:30px}.qtext{font-size:19px}.big{font-size:36px}.nlabel{width:104px;font-size:12px}}
</style>

<div id="app"></div>

<script>
/* =========================================================
   helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const bin = (n, w) => n.toString(2).padStart(w, '0');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const yesterdayStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return todayStr(d); };
function uniqInt(ctx, lo, hi) { for (let i = 0; i < 60; i++) { const n = R(lo, hi); if (!ctx.used.has(n)) { ctx.used.add(n); return n; } } return R(lo, hi); }
function sumExplain(s) { const w = s.length; const parts = []; for (let i = 0; i < w; i++) if (s[i] === '1') parts.push(2 ** (w - 1 - i)); return parts.length ? parts.join(' + ') + ' = ' + parts.reduce((a, b) => a + b, 0) : '0'; }
function diag(s) { const w = s.length; return '<span class="diag">' + [...s].map((c, i) => `<span><i>${2 ** (w - 1 - i)}</i><b class="${c === '1' ? 'on' : ''}">${c}</b></span>`).join('') + '</span>'; }

function hlJS(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)|\b(let|const|function|return|if|else|for|while|of|in|true|false|typeof|undefined|null|new)\b|\b(console|log|Math|floor|length|toString|push)\b|\b(0b[01]+|\d+(?:\.\d+)?)\b/gm;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'b' : 'n';
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const codeBlock = src => `<pre class="code">${hlJS(src)}</pre>`;

  { id: 'ta15', title: '高速変換', desc: 'タイムアタックで15問', mark: '15' },
  { id: 'net', title: 'ネットワーク入門', desc: 'IPアドレスのユニットをクリア', mark: 'IP' },
  { id: 'coder', title: 'はじめての実行', desc: 'プレイグラウンドで実行', mark: '>_' },
  { id: 'all', title: '全制覇', desc: '全レッスンをクリア', mark: 'ALL' }
];

/* =========================================================
   state
   ========================================================= */
const KEY = 'bitstep.v1';
const DEFAULT = { done: {}, xp: 0, streak: 0, lastDay: null, day: null, dayXp: 0, goal: 30, sound: true, review: [], badges: {}, reviewWins: 0, taBest: 0 };
let S = DEFAULT;
try { S = Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { S = { ...DEFAULT }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function liveStreak() { return (S.lastDay === todayStr() || S.lastDay === yesterdayStr()) ? S.streak : 0; }
function todayXp() { return S.day === todayStr() ? S.dayXp : 0; }
function addXp(n) {
  const t = todayStr();
  if (S.day !== t) { S.day = t; S.dayXp = 0; }
  S.dayXp += n; S.xp += n;
  if (S.lastDay !== t) { S.streak = S.lastDay === yesterdayStr() ? S.streak + 1 : 1; S.lastDay = t; }
  if (S.streak >= 3) award('streak3');
  save();
}
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = todayStr(); save();
  const b = BADGES.find(x => x.id === id);
  if (b) toast(`バッジ獲得：${b.title}`);
}
function qKey(q) { return (q.q || '') + '|' + (q.code || '') + '|' + (q.big || '') + '|' + (q.target ?? ''); }
function inReview(q) { const k = qKey(q); return S.review.some(r => r.k === k); }
function addReview(q, why) { const k = qKey(q); if (inReview(q)) return; S.review.unshift({ k, q, why }); S.review = S.review.slice(0, 60); save(); }
function removeReview(q) { const k = qKey(q); S.review = S.review.filter(r => r.k !== k); save(); }

/* =========================================================
   sound + toast
   ========================================================= */
let ac;
function beep(kind) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'ok' ? [660, 990] : kind === 'win' ? [523, 659, 784, 1046] : [220, 165];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.09;
      o.type = kind === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

/* =========================================================
   home
   ========================================================= */
const app = $('#app');
const OFFS = [0, 46, 72, 46, 0, -46, -72, -46];
const ROW = 108;
let onKey = null;
document.addEventListener('keydown', e => { if (onKey) onKey(e); });

function renderHome() {
  onKey = null; closeSheet(); stopTA();
  const firstOpen = LESSONS.findIndex(l => !S.done[l.id]);
  const st = liveStreak(), tx = todayXp(), doneCount = Object.keys(S.done).filter(k => LESSONS.some(l => l.id === k)).length;
  let gi = 0;
  const units = UNITS.map((u, ui) => {
    const n = u.lessons.length, H = n * ROW + 10;
    const pts = u.lessons.map((_, k) => ({ x: 150 + OFFS[(gi + k) % 8], y: k * ROW + 30 + 34 }));
    let segs = '';
    for (let k = 0; k < n - 1; k++) {
      const a = pts[k], b = pts[k + 1], mid = (a.y + b.y) / 2;
      const lit = S.done[u.lessons[k].id];
      const col = lit ? u.color : 'var(--trace)';
      segs += `<path d="M${a.x} ${a.y} V${mid} H${b.x} V${b.y}" stroke="${col}" stroke-width="6" fill="none" stroke-linejoin="round" ${lit ? '' : 'stroke-dasharray="2 10" stroke-linecap="round"'}/>`;
      if (a.x !== b.x) segs += `<circle cx="${a.x}" cy="${mid}" r="6" fill="var(--bg)" stroke="${col}" stroke-width="4"/><circle cx="${b.x}" cy="${mid}" r="6" fill="var(--bg)" stroke="${col}" stroke-width="4"/>`;
    }
    const nodes = u.lessons.map((l, k) => {
      const idx = gi + k, off = OFFS[idx % 8];
      const state = S.done[l.id] ? 'done' : idx === firstOpen ? 'current' : 'locked';
      const icon = state === 'done' ? I.check : state === 'current' ? I.play : I.lock;
      const side = off > 0 ? 'l' : 'r';
      const count = l.items.filter(it => typeof it === 'function' || it.t !== 'tip').length;
      return `<button class="node ${state}" data-lesson="${l.id}" style="left:calc(50% + ${off}px - 36px);top:${k * ROW + 30}px" aria-label="${esc(l.title)}（${state === 'done' ? 'クリア済み' : state === 'current' ? '次のレッスン' : 'ロック中'}）">${icon}${state === 'current' ? '<span class="bubble">はじめる</span>' : ''}</button>
        <div class="nlabel ${side}" style="${side === 'r' ? `left:calc(50% + ${off}px + 52px)` : `right:calc(50% - ${off}px + 52px)`};top:${k * ROW + 40}px"><small>LESSON ${ui + 1}-${k + 1} · ${count}問</small>${esc(l.title)}</div>`;
    }).join('');
    gi += n;
    return `<section class="unit" style="--uc:${u.color}">
      <div class="band" data-bits="${bin(ui + 1, 4)}"><p class="eyebrow">UNIT ${ui + 1} · 0b${bin(ui + 1, 4)}</p><h2>${esc(u.title)}</h2><p>${esc(u.desc)}</p></div>
      <div class="path" style="height:${H}px"><svg class="trace" width="300" height="${H}" viewBox="0 0 300 ${H}">${segs}</svg>${nodes}</div>
    </section>`;
  }).join('');

  app.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="brand">${mascot(30)}<span>ビットステップ</span></div>
    <div class="stats">
      <button class="stat ${st ? '' : 'off'}" data-act="profile" style="color:${st ? 'var(--accent)' : ''}" aria-label="連続日数 ${st}日">${I.flame}<span>${st}</span></button>
      <button class="stat" data-act="profile" style="color:var(--led)" aria-label="合計XP ${S.xp}">${I.bolt}<span style="color:var(--ink)">${S.xp}</span></button>
      <button class="iconbtn" data-act="sound" aria-label="効果音 ${S.sound ? 'オン' : 'オフ'}">${S.sound ? I.sound : I.mute}</button>
    </div>
  </div></header>
  <main class="wrap">
    <div class="goal">
      ${mascot(54, 'happy')}
      <div><h3>今日の目標 ${Math.min(tx, S.goal)} / ${S.goal} XP</h3>
        <div class="meter"><i style="width:${Math.min(100, tx / S.goal * 100)}%"></i></div>
        <p>${tx >= S.goal ? '今日の目標クリア！ この調子。' : `あと ${S.goal - tx} XP。1レッスン 3〜5分です。`}　全 ${LESSONS.length} レッスン中 ${doneCount} クリア</p></div>
    </div>
    <div class="tools">
      <button class="tool" data-act="review" style="color:var(--u4)">${S.review.length ? `<span class="badge">${S.review.length}</span>` : ''}${I.review}<span style="color:var(--ink)">苦手復習</span></button>
      <button class="tool" data-act="ta" style="color:var(--accent)">${I.timer}<span style="color:var(--ink)">タイムアタック</span></button>
      <button class="tool" data-act="pg" style="color:var(--u5)">${I.term}<span style="color:var(--ink)">コードを試す</span></button>
    </div>
    ${units}
    <p class="foot-note">進み具合はこのブラウザに保存されます。</p>
  </main>`;

  app.querySelectorAll('.node').forEach(b => b.onclick = () => openLessonSheet(b.dataset.lesson));
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'sound') { S.sound = !S.sound; save(); renderHome(); }
    if (a === 'profile') openProfile();
    if (a === 'review') startReview();
    if (a === 'ta') renderTA();
    if (a === 'pg') renderPG();
  });
}

function sheet(html) {
  closeSheet();
  const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.onclick = e => { if (e.target === s) closeSheet(); };
  document.body.appendChild(s);
  return s;
}
function closeSheet() { const s = $('#scrim'); if (s) s.remove(); }

function openLessonSheet(id) {
  const l = LESSONS.find(x => x.id === id), idx = LESSONS.indexOf(l);
  const firstOpen = LESSONS.findIndex(x => !S.done[x.id]);
  const locked = !S.done[id] && idx !== firstOpen;
  const s = sheet(`<p class="eyebrow" style="color:${l.unit.color}">UNIT ${l.ui + 1} · ${esc(l.unit.title)}</p>
    <h3>${esc(l.title)}</h3>
    <p class="meta">${locked ? '前のレッスンをクリアすると開きます。' : S.done[id] ? 'クリア済み。何度でもやり直せます。' : 'ハート 5 つでスタート。まちがえた問題は最後にもう一度出ます。'}</p>
    <div class="row">${locked ? '<button class="btn ghost" data-x>とじる</button>' : `<button class="btn ghost" data-x>とじる</button><button class="btn" data-go>${S.done[id] ? 'もう一度やる' : 'スタート'}</button>`}</div>`);
  s.querySelector('[data-x]').onclick = closeSheet;
  const go = s.querySelector('[data-go]'); if (go) { go.onclick = () => startLesson(id); go.focus(); }
}

function openProfile() {
  const st = liveStreak();
  const s = sheet(`<h3>きろく</h3>
    <div class="kv" style="margin-top:14px"><div><b>${st}</b><span>連続日数</span></div><div><b>${S.xp}</b><span>合計 XP</span></div><div><b>${S.taBest}</b><span>タイムアタック最高</span></div></div>
    <div class="badges">${BADGES.map(b => `<div class="bdg ${S.badges[b.id] ? 'got' : ''}"><div class="chip">${b.mark}</div><b>${b.title}</b>${b.desc}</div>`).join('')}</div>
    <p class="meta">1日の目標</p>
    <div class="row" style="margin-bottom:16px">${[20, 30, 50].map(g => `<button class="btn ${S.goal === g ? '' : 'ghost'}" data-goal="${g}">${g} XP</button>`).join('')}</div>
    <button class="btn ghost" data-x>とじる</button>`);
  s.querySelector('[data-x]').onclick = closeSheet;
  s.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { S.goal = +b.dataset.goal; save(); renderHome(); openProfile(); });
}

/* =========================================================
   lesson engine
   ========================================================= */
let L = null; // running lesson

function startLesson(id) {
  const l = LESSONS.find(x => x.id === id);
  const ctx = { used: new Set() };
  const items = l.items.map(it => typeof it === 'function' ? it(ctx) : it);
  runSession({ mode: 'lesson', lesson: l, items, color: l.unit.color });
}
function startReview() {
  if (!S.review.length) {
    const s = sheet(`<div style="display:flex;gap:14px;align-items:center">${mascot(64)}<div><h3>復習する問題はまだありません</h3><p class="meta">まちがえた問題と、「あとで復習」を押した問題がここにたまります。</p></div></div><button class="btn" data-x>OK</button>`);
    s.querySelector('[data-x]').onclick = closeSheet; return;
  }
  const items = shuffle(S.review).slice(0, 5).map(r => r.q);
  runSession({ mode: 'review', items, color: 'var(--u4)' });
}

function runSession(cfg) {
  closeSheet();
  L = { ...cfg, queue: cfg.items.slice(), total: cfg.items.length, done: 0, hearts: cfg.mode === 'review' ? Infinity : 5, mistakes: 0, graded: 0, correct: 0, phase: 'answer', cur: null };
  nextItem();
}

function lessonShell(inner) {
  const pct = Math.round(L.done / L.total * 100);
  app.innerHTML = `<div class="lesson"><div class="wrap" style="width:100%;box-sizing:border-box;flex:1;display:flex;flex-direction:column">
    <div class="ltop">
      <button class="iconbtn" data-quit aria-label="やめる">${I.x}</button>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="hearts" aria-label="ハート">${I.heart}<span>${L.hearts === Infinity ? '∞' : L.hearts}</span></div>
    </div>
    <div class="qarea">${inner}</div>
  </div></div>
  <div class="foot" id="foot"><div class="wrap" id="footin"></div></div>`;
  $('[data-quit]').onclick = confirmQuit;
}
function confirmQuit() {
  const s = sheet(`<div style="display:flex;gap:14px;align-items:center">${mascot(64, 'sad')}<div><h3>ほんとうにやめる？</h3><p class="meta">このレッスンの進み具合は保存されません。</p></div></div>
    <div class="row"><button class="btn ghost" data-q>やめる</button><button class="btn" data-x>つづける</button></div>`);
  s.querySelector('[data-x]').onclick = closeSheet;
  s.querySelector('[data-q]').onclick = renderHome;
}

function nextItem() {
  if (!L.queue.length) return finishSession();
  const q = L.queue[0];
  L.phase = 'answer';
  if (q.t === 'tip') return renderTip(q);
  renderQuestion(q);
}

function renderTip(q) {
  lessonShell(`<p class="qkind">ヒント</p><div class="tip">${mascot(76, 'happy', true)}<div class="say"><h3>${esc(q.title)}</h3>${q.body}</div></div>`);
  $('#footin').innerHTML = `<button class="btn" id="primary">つづける</button>`;
  const go = () => { L.queue.shift(); L.done++; nextItem(); };
  $('#primary').onclick = go; $('#primary').focus();
  onKey = e => { if (e.key === 'Enter' && !$('#scrim')) { e.preventDefault(); go(); } };
}

const KIND = { choice: 'えらぶ', input: 'こたえを書く', bits: 'ランプを切りかえる', order: 'ならべる' };

function renderQuestion(q) {
  const head = `<p class="qkind"><span>${KIND[q.t]}</span><button class="bm ${inReview(q) ? 'on' : ''}" id="bm" title="「分かったつもり」の問題を復習リストに入れる">${inReview(q) ? '復習リストに追加済み' : 'あとで復習'}</button></p>
    <h2 class="qtext">${esc(q.q)}</h2>${q.code ? codeBlock(q.code) : ''}${q.big ? `<div class="big">${q.big}</div>` : ''}`;
  let body = '', cur = {};
  if (q.t === 'choice') {
    const order = shuffle(q.opts.map((_, i) => i));
    body = `<div class="opts ${q.two ? 'two' : ''}">${order.map((oi, k) => `<button class="opt ${q.mono ? 'mono' : ''}" data-oi="${oi}"><span class="k">${k + 1}</span><span class="t">${esc(q.opts[oi])}</span></button>`).join('')}</div>`;
    cur = { sel: null, order };
  } else if (q.t === 'input') {
    body = `<input class="field" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${/^\d+$/.test(q.a[0]) ? 'numeric' : 'text'}" placeholder="${esc(q.ph || 'こたえ')}">`;
  } else if (q.t === 'bits') {
    cur = { bits: Array(q.n).fill(0) };
    body = `<div class="bits" style="--n:${q.n}">${cur.bits.map((_, i) => `<button class="bit" data-i="${i}" aria-pressed="false" aria-label="重み ${2 ** (q.n - 1 - i)}"><span class="w">${2 ** (q.n - 1 - i)}</span><span class="lamp">${I.bulb}</span><span class="v">0</span></button>`).join('')}</div><div class="bitsum" id="bitsum"></div>`;
  } else if (q.t === 'order') {
    const bank = shuffle([...q.tokens, ...(q.extra || [])]);
    cur = { bank, picked: [] };
    body = `<div class="slot" id="slot" aria-label="こたえ"></div><div class="bank" id="bank">${bank.map((t, i) => `<button class="tok" data-bi="${i}">${esc(t)}</button>`).join('')}</div>`;
  }
  lessonShell(head + body);
  L.cur = cur;
  $('#footin').innerHTML = `<button class="btn" id="primary" disabled>チェック</button>`;
  const primary = $('#primary');
  const setReady = r => { primary.disabled = !r; };
  $('#bm').onclick = e => {
    if (inReview(q)) removeReview(q); else addReview(q, 'bookmark');
    e.currentTarget.classList.toggle('on', inReview(q));
    e.currentTarget.textContent = inReview(q) ? '復習リストに追加済み' : 'あとで復習';
  };

  if (q.t === 'choice') {
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (L.phase !== 'answer') return;
      app.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); cur.sel = +b.dataset.oi; setReady(true);
    });
  } else if (q.t === 'input') {
    const f = $('#ans'); f.oninput = () => setReady(f.value.trim().length > 0); setTimeout(() => f.focus(), 30);
  } else if (q.t === 'bits') {
    const upd = () => {
      const v = cur.bits.reduce((a, b, i) => a + b * 2 ** (q.n - 1 - i), 0);
      $('#bitsum').innerHTML = q.showSum ? `2進数 <b>${cur.bits.join('')}</b>　＝　10進数 <b>${v}</b>` : `2進数 <b>${cur.bits.join('')}</b>`;
      setReady(cur.bits.some(b => b));
    };
    app.querySelectorAll('.bit').forEach(b => b.onclick = () => {
      if (L.phase !== 'answer') return;
      const i = +b.dataset.i; cur.bits[i] ^= 1;
      b.classList.toggle('on', !!cur.bits[i]); b.setAttribute('aria-pressed', !!cur.bits[i]); b.querySelector('.v').textContent = cur.bits[i];
      upd();
    });
    upd(); primary.disabled = true;
  } else if (q.t === 'order') {
    const draw = () => {
      $('#slot').innerHTML = cur.picked.map((bi, k) => `<button class="tok" data-pk="${k}">${esc(cur.bank[bi])}</button>`).join('');
      app.querySelectorAll('#bank .tok').forEach(b => b.classList.toggle('used', cur.picked.includes(+b.dataset.bi)));
      app.querySelectorAll('#slot .tok').forEach(b => b.onclick = () => { if (L.phase !== 'answer') return; cur.picked.splice(+b.dataset.pk, 1); draw(); });
      setReady(cur.picked.length > 0);
    };
    app.querySelectorAll('#bank .tok').forEach(b => b.onclick = () => { if (L.phase !== 'answer') return; const bi = +b.dataset.bi; if (!cur.picked.includes(bi)) { cur.picked.push(bi); draw(); } });
    draw();
  }
  primary.onclick = () => check(q);
  onKey = e => {
    if ($('#scrim')) return;
    if (e.key === 'Enter') { e.preventDefault(); const p = $('#primary'); if (p && !p.disabled) p.click(); }
    else if (L.phase === 'answer' && q.t === 'choice' && /^[1-9]$/.test(e.key)) { const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b) b.click(); }
  };
}

const norm = s => String(s).replace(/[０-９ａ-ｚＡ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[\s　]/g, '').toLowerCase();

function evaluate(q) {
  const cur = L.cur;
  if (q.t === 'choice') return { ok: cur.sel === q.a, ans: q.opts[q.a] };
  if (q.t === 'input') { const v = norm($('#ans').value); return { ok: q.a.some(a => norm(a) === v), ans: q.a[0] }; }
  if (q.t === 'bits') { const v = cur.bits.reduce((a, b, i) => a + b * 2 ** (q.n - 1 - i), 0); return { ok: v === q.target, ans: `${bin(q.target, q.n)}（${sumExplain(bin(q.target, q.n))}）` }; }
  if (q.t === 'order') { const got = cur.picked.map(bi => cur.bank[bi]).join('\u0001'); const ok = [q.tokens, ...(q.alts || [])].some(t => t.join('\u0001') === got); return { ok, ans: q.tokens.join(' ') }; }
}

const PRAISE = ['正解！', 'すごい！', 'いいね！', 'その調子！', 'パーフェクト！'];
function check(q) {
  if (L.phase !== 'answer') return;
  L.phase = 'feedback';
  const r = evaluate(q);
  L.graded++;
  if (q.t === 'input') $('#ans').disabled = true;
  if (r.ok) {
    L.correct++; beep('ok');
    if (L.mode === 'review') { removeReview(q); S.reviewWins++; save(); if (S.reviewWins >= 5) award('review'); }
  } else {
    L.mistakes++; beep('bad');
    if (L.hearts !== Infinity) L.hearts--;
    $('.hearts span').textContent = L.hearts === Infinity ? '∞' : L.hearts;
    addReview(q, 'miss');
  }
  const foot = $('#foot'); foot.classList.add(r.ok ? 'ok' : 'bad');
  const exHtml = q.ex ? `<p>${q.ex}</p>` : '';
  $('#footin').innerHTML = `<div class="fb"><div class="ic">${r.ok ? I.check : I.cross}</div><div>
      <h4>${r.ok ? PRAISE[R(0, PRAISE.length - 1)] : 'おしい…'}</h4>
      ${r.ok ? exHtml : `<p>正解：<span class="ans">${esc(r.ans)}</span></p>${exHtml}${L.mode === 'lesson' ? '<p style="color:var(--muted)">この問題はあとでもう一度出ます。</p>' : ''}`}
    </div></div>
    <div class="row">${q.code ? '<button class="btn ghost try" id="try">実行して確かめる</button>' : ''}<button class="btn ${r.ok ? 'okb' : 'badb'}" id="primary">つづける</button></div>`;
  $('#primary').focus();
  if (q.code) $('#try').onclick = () => { const back = { L, q }; renderPG(q.code, back); };
  $('#primary').onclick = () => {
    L.queue.shift();
    if (r.ok) L.done++;
    else if (L.mode === 'lesson') L.queue.push(q);
    else L.done++;
    if (L.hearts <= 0) return failSession();
    nextItem();
  };
}

function failSession() {
  onKey = null; beep('bad');
  app.innerHTML = `<div class="wrap center">${mascot(120, 'sad')}<h1 style="color:var(--bad)">ハートがなくなった</h1>
    <p>まちがえた問題は「苦手復習」に入りました。<br>ヒントを読み直して、もう一度ためしてみよう。</p>
    <div style="width:100%;max-width:420px;display:grid;gap:12px;margin-top:12px"><button class="btn" id="retry">もう一度</button><button class="btn ghost" id="home">ホームへ</button></div></div>`;
  $('#retry').onclick = () => startLesson(L.lesson.id);
  $('#home').onclick = renderHome;
}

function finishSession() {
  onKey = null;
  const acc = L.graded ? Math.round(L.correct / L.graded * 100) : 100;
  let xp;
  if (L.mode === 'lesson') {
    const first = !S.done[L.lesson.id];
    xp = (first ? 10 : 5) + (L.mistakes === 0 ? 5 : 0);
    S.done[L.lesson.id] = Math.max(S.done[L.lesson.id] || 0, acc);
    award('first');
    if (L.mistakes === 0) award('perfect');
    if (UNITS[0].lessons.every(l => S.done[l.id])) award('unit1');
    if (UNITS.find(u => u.id === 'net').lessons.every(l => S.done[l.id])) award('net');
    if (LESSONS.every(l => S.done[l.id])) award('all');
  } else xp = L.correct * 2;
  addXp(xp);
  beep('win');
  const title = L.mode === 'review' ? '復習おわり！' : L.mistakes === 0 ? 'ノーミスクリア！' : 'レッスンクリア！';
  app.innerHTML = `<div class="wrap center">${mascot(130, 'happy', true)}<h1>${title}</h1>
    <p>${L.mode === 'review' ? `正解した問題は苦手リストから消えました。のこり ${S.review.length} 問。` : esc(L.lesson.title) + ' をクリアしました。'}</p>
    <div class="tiles">
      <div class="tile" style="--tc:var(--led)"><span>獲得 XP</span><b>+${xp}</b></div>
      <div class="tile" style="--tc:var(--ok)"><span>正答率</span><b>${acc}%</b></div>
      <div class="tile" style="--tc:var(--accent)"><span>連続日数</span><b>${liveStreak()}日</b></div>
    </div>
    <div style="width:100%;max-width:420px;margin-top:16px"><button class="btn" id="home">つづける</button></div></div>`;
  $('#home').onclick = renderHome; $('#home').focus();
  onKey = e => { if (e.key === 'Enter') { e.preventDefault(); renderHome(); } };
}

/* =========================================================
   time attack: binary -> decimal, 60 seconds
   ========================================================= */
let TA = null;
function stopTA() { if (TA && TA.timer) clearInterval(TA.timer); TA = null; }
function renderTA() {
  stopTA(); closeSheet();
  app.innerHTML = `<div class="wrap center">${mascot(110, 'happy', true)}<h1>タイムアタック</h1>
    <p>60秒で、2進数を10進数に何問直せるかな？<br>5問ごとにけたが増えます。最高記録：<b style="color:var(--ink)">${S.taBest}問</b></p>
    <div style="width:100%;max-width:420px;display:grid;gap:12px;margin-top:12px"><button class="btn" id="go">スタート</button><button class="btn ghost" id="home">ホームへ</button></div></div>`;
  $('#go').onclick = playTA; $('#home').onclick = renderHome; $('#go').focus();
  onKey = null;
}
function playTA() {
  TA = { left: 60, score: 0, miss: 0, n: 0 };
  app.innerHTML = `<div class="wrap" style="padding-block:16px 40px">
    <div class="ltop"><button class="iconbtn" id="quit" aria-label="やめる">${I.x}</button><div class="bar"><i id="tbar" style="width:100%;background:var(--accent)"></i></div><span class="ta-timer" id="tleft">60</span></div>
    <p class="qkind"><span>10進数に直そう</span><span id="tscore">0問</span></p>
    <div class="big" id="tq"></div>
    <input class="field" id="tans" inputmode="numeric" autocomplete="off" placeholder="答えを入れて Enter">
    <p style="color:var(--muted);font-size:13px;text-align:center;margin-top:10px">Enter で答え合わせ。まちがえても次へ進みます。</p>
    <div style="margin-top:8px"><button class="btn" id="tsend">答える</button></div>
  </div>`;
  const newQ = () => { const w = TA.score < 5 ? 4 : TA.score < 10 ? 5 : TA.score < 15 ? 6 : 8; TA.n = R(1, 2 ** w - 1); $('#tq').textContent = bin(TA.n, w); $('#tans').value = ''; $('#tans').focus(); };
  const send = () => {
    const f = $('#tans'); if (!f.value.trim()) return;
    const ok = norm(f.value) === String(TA.n);
    const el = $('#tq'); el.classList.remove('flash-ok', 'flash-bad'); void el.offsetWidth; el.classList.add(ok ? 'flash-ok' : 'flash-bad');
    if (ok) { TA.score++; beep('ok'); } else { TA.miss++; beep('bad'); }
    $('#tscore').textContent = TA.score + '問'; newQ();
  };
  $('#tsend').onclick = send; $('#quit').onclick = renderHome;
  onKey = e => { if (e.key === 'Enter') { e.preventDefault(); send(); } };
  newQ();
  TA.timer = setInterval(() => {
    TA.left--; $('#tleft').textContent = TA.left; $('#tbar').style.width = (TA.left / 60 * 100) + '%';
    if (TA.left <= 0) endTA();
  }, 1000);
}
function endTA() {
  const { score, miss } = TA; stopTA(); onKey = null;
  const best = score > S.taBest; if (best) S.taBest = score;
  if (score >= 15) award('ta15');
  const xp = Math.max(1, Math.floor(score / 2)); addXp(xp); beep('win');
  app.innerHTML = `<div class="wrap center">${mascot(120, 'happy', true)}<h1>${best ? '新記録！' : 'タイムアップ'}</h1>
    <div class="tiles"><div class="tile" style="--tc:var(--ok)"><span>正解</span><b>${score}</b></div><div class="tile" style="--tc:var(--bad)"><span>ミス</span><b>${miss}</b></div><div class="tile" style="--tc:var(--led)"><span>獲得 XP</span><b>+${xp}</b></div></div>
    <div style="width:100%;max-width:420px;display:grid;gap:12px;margin-top:16px"><button class="btn" id="again">もう一回</button><button class="btn ghost" id="home">ホームへ</button></div></div>`;
  $('#again').onclick = playTA; $('#home').onclick = renderHome;
}

/* =========================================================
   playground: run JavaScript in a worker with a timeout
   ========================================================= */
const SAMPLES = {
  '2進数に変換': 'let n = 13;\nconsole.log(n + " を2進数にすると " + n.toString(2));\n\n// n の数を変えて実行してみよう',
  '重みの表': 'let w = 1;\nfor (let i = 0; i < 8; i++) {\n  console.log("右から" + (i + 1) + "番目の重み: " + w);\n  w = w * 2;\n}',
  '条件分岐': 'let score = 72;\nif (score >= 80) {\n  console.log("A");\n} else if (score >= 60) {\n  console.log("B");\n} else {\n  console.log("C");\n}',
  'IPを2進数に': 'let ip = "192.168.1.10";\nlet bits = ip.split(".").map(n => Number(n).toString(2).padStart(8, "0"));\nconsole.log(bits.join("."));\n\n// サブネットマスク /26 と AND してみる\nlet last = 150;\nconsole.log("ネットワーク: " + (last & 0b11000000));',
  '関数': 'function toBinary(n) {\n  let s = "";\n  while (n > 0) {\n    s = (n % 2) + s;\n    n = Math.floor(n / 2);\n  }\n  return s;\n}\nconsole.log(toBinary(10));'
};
const WORKER_SRC = `const fmt=v=>typeof v==='string'?v:(v===undefined?'undefined':(typeof v==='object'?JSON.stringify(v):String(v)));
onmessage=e=>{const out=[];const c={log:(...a)=>out.push(['log',a.map(fmt).join(' ')]),error:(...a)=>out.push(['err',a.map(fmt).join(' ')])};
try{new Function('console',e.data)(c)}catch(err){out.push(['err',err.name+': '+err.message])}postMessage(out)}`;
function runJS(src) {
  return new Promise(resolve => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }))); }
    catch (e) { return resolve(runInline(src)); }
    const t = setTimeout(() => { w.terminate(); resolve([['err', '2秒たっても終わりませんでした。無限ループになっていないか確認しよう。']]); }, 2000);
    w.onmessage = e => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = e => { clearTimeout(t); w.terminate(); e.preventDefault(); resolve([['err', e.message || '実行できませんでした']]); };
    w.postMessage(src);
  });
}
function runInline(src) {
  const out = [], fmt = v => typeof v === 'string' ? v : v === undefined ? 'undefined' : typeof v === 'object' ? JSON.stringify(v) : String(v);
  try { new Function('console', src)({ log: (...a) => out.push(['log', a.map(fmt).join(' ')]), error: (...a) => out.push(['err', a.map(fmt).join(' ')]) }); }
  catch (e) { out.push(['err', e.name + ': ' + e.message]); }
  return out;
}
function renderPG(code, back) {
  stopTA(); closeSheet(); onKey = null;
  app.innerHTML = `<div class="wrap pg" style="padding-block:16px 60px">
    <div class="ltop"><button class="iconbtn" id="back" aria-label="もどる">${I.x}</button><h1>コードを試す</h1></div>
    <p class="lead">${back ? '問題のコードです。数字を書きかえて、結果がどう変わるか試してみよう。' : 'JavaScript を書いて実行できます。console.log() で表示。'}</p>
    ${back ? '' : `<div class="samples">${Object.keys(SAMPLES).map(k => `<button data-s="${esc(k)}">${esc(k)}</button>`).join('')}</div>`}
    <label for="pg-code" class="qkind" style="display:block">コード</label>
    <textarea id="pg-code" spellcheck="false">${esc(code || SAMPLES['2進数に変換'])}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn" id="run">▶ 実行（Ctrl + Enter）</button></div>
    <div class="out" id="out" aria-live="polite"><span class="dim">ここに結果が出ます</span></div>
    ${back ? '<div style="margin-top:16px"><button class="btn ghost" id="ret">問題にもどる</button></div>' : ''}
  </div>`;
  const ta = $('#pg-code');
  const run = async () => {
    $('#out').innerHTML = '<span class="dim">実行中…</span>';
    const res = await runJS(ta.value);
    award('coder');
    $('#out').innerHTML = res.length ? res.map(([k, v]) => `<div class="${k === 'err' ? 'err' : ''}">${esc(v)}</div>`).join('') : '<span class="dim">（何も表示されませんでした）</span>';
  };
  $('#run').onclick = run;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); }
  });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { ta.value = SAMPLES[b.dataset.s]; $('#out').innerHTML = '<span class="dim">ここに結果が出ます</span>'; });
  const ret = () => { if (back) { L = back.L; resumeAfterTry(back.q); } else renderHome(); };
  $('#back').onclick = ret; if ($('#ret')) $('#ret').onclick = ret;
}
// after trying the code, return to the lesson at the "continue" step
function resumeAfterTry(q) {
  // the question was already graded; move on as if "つづける" was pressed with its result
  L.queue.shift();
  if (L.lastResult === false && L.mode === 'lesson') L.queue.push(q); else L.done++;
  if (L.hearts <= 0) return failSession();
  nextItem();
}
// remember result for resume
const _check = check;
check = function (q) { _check(q); L.lastResult = $('#foot').classList.contains('ok'); };

renderHome();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
